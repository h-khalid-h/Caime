    <!-- Caime's icons, made by packages/brand/scripts/build-assets.mts. The .ico is for browsers
         without SVG favicons; its sizes lets the others take the vector mark, sharp at any size. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

         brand's two families by weight: the app on the web (theme/fonts.web.ts) and the server's

         takes only the weights and ranges it draws. -->

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->

      body {
