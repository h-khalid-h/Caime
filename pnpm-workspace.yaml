packages:
  - apps/*
  - packages/*

# Some React Native libraries still fail under isolated installs (docs/ARCHITECTURE.md ADR-1).
nodeLinker: hoisted

# Dependencies allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - esbuild

# Security overrides. Each names the advisory and when it can go (docs/SECURITY.md).
overrides:
  # GHSA-vcc3-ghjq-m6fr: the fix is ESM-only and query-string@7 (expo-router) requires it from CJS.
  decode-uri-component: file:./vendor/decode-uri-component
  # GHSA-w5hq-g745-h8pq: xcode (iOS prebuild tooling) only calls uuid.v4, which 11.x keeps in CJS.
  xcode>uuid: ^11.1.1
  # GHSA-68fv-2mgg-jv7q: source-map-js < 1.2.2 (postcss in Expo's metro config): the patch release.
  source-map-js: ^1.2.2
  # GHSA-pqg4-j6r4-53mv: shell-quote < 1.11.0 (react-native's devtools): the fixed minor, same API.
  shell-quote: ^1.11.0

# Advisories without a fixed release yet, both in Expo's command line (the web export and the dev
# server): neither package is in the server image (`pnpm deploy --prod` of the server alone) or
# in the browser bundle. Each goes the day its package publishes a fix (docs/SECURITY.md).
auditConfig:
  ignoreGhsas:
    # node-forge <= 1.4.0, RSA PKCS#1 v1.5 signature verification: only expo's dev certificates.
    - GHSA-86w9-cpqp-85rv
    # braces <= 3.0.3, stack exhaustion on a deeply nested glob: metro's file map, our own globs.
    - GHSA-vfj7-8cjw-p6xm
