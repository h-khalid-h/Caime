name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    # Pinned while ubuntu-latest moves to 26.04 (from 2026-10-19): Playwright has no browsers for
    # it yet (it names the host ubuntu26.04-x64 and stops), so the E2E failed before a test ran.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caime
          POSTGRES_PASSWORD: caime-dev
          POSTGRES_DB: caime
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U caime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://caime:caime-dev@localhost:5432/caime
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the migrations lint asks whether a commit is already in production.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # What this release's migrations keep to (CLAUDE.md convention 7), against what production
      # runs: append-only, contractions a release after their readers, backfills in batches, big
      # indexes built concurrently.
      - name: Migrations lint
        run: |
          git fetch --no-tags origin production
          node scripts/migrations-lint.mjs origin/production
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - run: pnpm test

  # The production bundle and the E2E beside the checks, in two halves at once: one job doing all
  # of it in series reached 29.5 of its 30 minutes (2026-10-25) and the next was cancelled. Each
  # half (playwright.config.ts, `E2E_HALF`: the two longest files, and the rest) builds what it
  # tests and starts from an empty database.
  e2e:
    name: Build, budget, end-to-end (${{ matrix.half }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Both halves report, so one red half never hides the other's failures.
      fail-fast: false
      matrix:
        half: [longest, rest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caime
          POSTGRES_PASSWORD: caime-dev
          POSTGRES_DB: caime
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U caime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://caime:caime-dev@localhost:5432/caime
      E2E_DATABASE_URL: postgres://caime:caime-dev@localhost:5432/caime_e2e
      E2E_HALF: ${{ matrix.half }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Web performance budget
        run: pnpm budget
      - name: End-to-end
        run: |
          psql "$DATABASE_URL" -c "create database caime_e2e"
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.half }}
          path: |
            e2e/screenshots
            playwright-report
            test-results
          retention-days: 14

  image:
    name: Build and smoke-test the image, then release
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The image is built and smoke-tested once both have passed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # write: to move the production branch forward once this commit has passed everything.
      contents: write
      # write: to publish the tested image to the GitHub Container Registry (A3).
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the release below can tell it's a fast-forward of production
          # (a shallow checkout doesn't know production's commit, and git refuses the push).
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      # The image, built here from the same Dockerfile EasyPanel builds from, tried below before
      # production moves, then published by its sha (A3): what runs can be exactly what passed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: caime:${{ github.sha }}
          build-args: |
            CAIME_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Smoke-test the image
        run: |
          docker network create caime
          docker run -d --name db --network caime -e POSTGRES_USER=caime -e POSTGRES_PASSWORD=caime -e POSTGRES_DB=caime postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U caime && break; sleep 1; done
          docker run -d --name app --network caime -p 8787:8787 \
            -e DATABASE_URL=postgres://caime:caime@db:5432/caime \
            -e PUBLIC_URL=http://localhost:8787 \
            caime:${{ github.sha }}
          for i in $(seq 1 60); do curl -fsS http://localhost:8787/v1/readyz && break; sleep 1; done
          curl -fsS http://localhost:8787/v1/readyz
          # The image says which commit it is (docs/DEPLOY.md: a deploy is verified by what answers).
          curl -fsS http://localhost:8787/v1/healthz | grep -q "\"version\":\"${GITHUB_SHA}\""
          curl -fsS http://localhost:8787/ | grep -q '<div id="root">'
          # The web app's security headers (docs/SECURITY.md, "Web app").
          curl -fsSI http://localhost:8787/ > headers.txt
          grep -qi "^content-security-policy:.*script-src 'self'" headers.txt
          grep -qi "^content-security-policy:.*frame-ancestors 'none'" headers.txt
          grep -qi '^cache-control: no-cache' headers.txt
          docker logs app | tail -20
      # The tested image, published by its sha (ghcr.io/<owner>/caime:<sha>; the repository is
      # public, so the package is too and EasyPanel pulls it with no credential). A failure here
      # is a warning, not a red run: production deploys from the branch until the service is
      # switched to the image (docs/DEPLOY.md, "Running the tested image").
      - name: Publish the tested image
        id: publish
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/caime"
          docker tag "caime:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
      # Staging first (docs/DEPLOY.md, "Staging"), when the owner has made it: its `staging` tag
      # moves, its webhook redeploys it, and production waits until staging answers as this
      # commit and is ready. Staging that never comes up on it is a red run: production stays.
      - name: Try it on staging first
        env:
          EASYPANEL_STAGING_DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_STAGING_DEPLOY_WEBHOOK }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        if: env.EASYPANEL_STAGING_DEPLOY_WEBHOOK != '' && env.STAGING_URL != '' && steps.publish.outcome == 'success'
        run: |
          IMAGE="${{ steps.publish.outputs.image }}"
          docker tag "caime:${GITHUB_SHA}" "${IMAGE}:staging"
          docker push "${IMAGE}:staging"
          curl -fsS -X POST "$EASYPANEL_STAGING_DEPLOY_WEBHOOK"
          version=""
          for i in $(seq 1 60); do
            version=$(curl -fsS "${STAGING_URL%/}/v1/healthz" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            [ "$version" = "$GITHUB_SHA" ] && break
            sleep 10
          done
          if [ "$version" != "$GITHUB_SHA" ]; then
            echo "staging never came up on ${GITHUB_SHA} (it answers as '${version}')"; exit 1
          fi
          curl -fsS "${STAGING_URL%/}/v1/readyz"
      # The `production` tag names what production should run now (the sha tag stays for a roll
      # back); it moves only with the branch below.
      - name: Point the production tag at it
        if: steps.publish.outcome == 'success'
        run: |
          IMAGE="${{ steps.publish.outputs.image }}"
          docker tag "caime:${GITHUB_SHA}" "${IMAGE}:production"
          docker push "${IMAGE}:production"
      # EasyPanel builds and deploys from the `production` branch (docs/DEPLOY.md), which only
      # ever moves to a commit that passed every check above. A fast-forward, never a rewrite.
      - name: Release to production
        run: git push origin "${GITHUB_SHA}:refs/heads/production"
      - name: Deploy to EasyPanel
        env:
          EASYPANEL_DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        if: env.EASYPANEL_DEPLOY_WEBHOOK != ''
        run: curl -fsS -X POST "$EASYPANEL_DEPLOY_WEBHOOK"
